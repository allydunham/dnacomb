[package]
name = "dnacomb"
version = "0.6.0"
edition = "2024"
authors = ["Alistair Dunham", "Eric Hidari"]
description = "Count the occurances of structured sequence reads and compare to an expected library"
documentation = "https://github.com/allydunham/dnacomb"
readme = "README.md"
homepage = "https://github.com/allydunham/dnacomb"
repository = "https://github.com/allydunham/dnacomb"
license = "MIT"
keywords = ["cli", "bioinformatics", "sequencing", "reads", "library"]
categories = ["command-line-utilities", "science::bioinformatics::sequence-analysis"]
publish = true
exclude = [
    "scripts/",
    "config/",
    "data/",
    "plots/"
]

[lib]
name = "dnacomb"
path = "src/lib.rs"

[[bin]]
name = "dnacomb"
path = "src/main.rs"

[features]
default = ["interning"]
interning = ["dep:once_cell", "dep:parking_lot", "dep:dashmap", "dep:ahash", "dep:lasso"]

[dependencies]
clap = { version = "4.3.19", features = ["derive", "wrap_help"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
bio = "2.2.0"
anyhow = "1.0.96"
csv = "1.3.1"
flate2 = "1.1.0"
regex = "1.11.1"
log = { version = "0.4", features = ["max_level_trace", "release_max_level_info"] }
env_logger = "0.11.6"
itertools = "0.14.0"
crossbeam = "0.8.4"
once_cell   = { version = "1", optional = true }
parking_lot = { version = "0.12", optional = true }
dashmap     = { version = "6", optional = true }
ahash       = { version = "0.8", optional = true }
lasso       = { version = "0.7", optional = true, features = ["multi-threaded"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = { version = "3.27" }

[[bench]]
name = "bench_library_lookup"
harness = false

[[bench]]
name = "bench_seq_diff"
harness = false

[[bench]]
name = "bench_combinations"
harness = false

[[bench]]
name = "bench_counting"
harness = false

[[bench]]
name = "bench_interning"
harness = false
